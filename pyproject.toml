[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-bale-bot"
description = "An API wrapper for Bale written in Python"
authors = [
    { name = "Kian Ahmadian", email = "devs@python-bale-bot.ir" }
]
readme = { file = "README.rst", content-type = "text/x-rst" }
license = "GPL-2.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Natural Language :: Persian",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
keywords = [
    "bale",
    "bale-bot",
    "framework",
    "bot",
]
dynamic = ["version", "dependencies"]

[tool.setuptools.dynamic]
version = { attr = "bale.version.__version__" }
dependencies = { file = "requirements.txt" }

[project.urls]
"Homepage" = "https://python-bale-bot.ir"
"Documentation" = "https://docs.python-bale-bot.ir/en/stable/"
"Bug Tracker" = "https://github.com/python-bale-bot/python-bale-bot/issues"
"Source Code" = "https://github.com/python-bale-bot/python-bale-bot/"
"News" = "https://ble.ir/pbblib"
"Changelog" = "https://python-bale-bot.ir/changelog"
"Support" = "https://ble.ir/pbblib"

[project.optional-dependencies]
docs = [
    'sphinx==7.3.7',
    'sphinx-pypi-upload',
    'sphinx-paramlinks==0.6.0',
    'sphinxcontrib-mermaid==0.8.1',
    'sphinx-copybutton==0.5.2',
    'furo==2024.5.6',
    'sphinx-inline-tabs==2023.4.21'
]

[tool.setuptools.packages.find]
where = ["."]
include = ["bale*"]

[tool.pyright]
include = [
    "bale"
]
exclude = [
    "build",
    "**/__pycache__",
    "dist",
    "docs",
]

[tool.setuptools.package-data]
bale = ["py.typed"]

[tool.pylint.'MESSAGES CONTROL']
disable = ["line-too-long", "too-many-instance-attributes", "too-many-arguments", "missing-function-docstring", "too-many-positional-arguments", "too-many-public-methods", "missing-module-docstring", "too-many-locals", "too-many-lines", "no-member", "too-few-public-methods", "duplicate-code", "broad-exception-caught"]